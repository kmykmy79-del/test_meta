<script type="module">

}
const colliders = []; // {x,z,r}
// fountain
cyl(4, 4.5, 1, 0x94a3b8, 0, .5, 0); cyl(3.5, 3.5, .2, 0x38bdf8, 0, 1, 0); cyl(.5, .7, 3, 0x94a3b8, 0, 1.5, 0);

function wallTex(cols, rows, wall = '#f3e6c9', win = '#7dd3fc') {
  const cv = document.createElement('canvas'); cv.width = cols * 64; cv.height = rows * 64; const g = cv.getContext('2d');
  g.fillStyle = wall; g.fillRect(0, 0, cv.width, cv.height);
  for (let y = 0; y < rows; y++) { g.fillStyle = '#d9c8a5'; g.fillRect(0, y * 64 + 58, cv.width, 6); for (let x = 0; x < cols; x++) { g.fillStyle = '#e5e7eb'; g.fillRect(x * 64 + 9, y * 64 + 11, 46, 40); g.fillStyle = win; g.fillRect(x * 64 + 12, y * 64 + 14, 40, 34); g.fillStyle = '#e5e7eb'; g.fillRect(x * 64 + 31, y * 64 + 14, 2, 34); } }
  const tx = new THREE.CanvasTexture(cv); tx.colorSpace = THREE.SRGBColorSpace; return tx;
}
function building(w, h, d, x, z, cols, rows, roof = 0x9a3412, wall = '#f3e6c9') {
  const front = new THREE.MeshStandardMaterial({ map: wallTex(cols, rows, wall), roughness: .9 });
  const side = new THREE.MeshStandardMaterial({ map: wallTex(Math.max(2, Math.round(cols * d / w)), rows, wall), roughness: .9 });
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), [side, side, mat(0xd9c8a5), mat(0xd9c8a5), front, front]);
  m.position.set(x, h / 2, z); m.castShadow = m.receiveShadow = true; scene.add(m);
  box(w + 1.2, .7, d + 1.2, roof, x, h + .35, z);
  RECTS.push({ x0: x - w / 2, x1: x + w / 2, z0: z - d / 2, z1: z + d / 2 });
  return m;
}
function plate(text, x, y, z, w = 10, bg = '#1e3a8a', rotY = 0) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, w / 5), new THREE.MeshBasicMaterial({ map: textTexture([text], 1024, 205, bg, '#fff', 120) }));
  m.position.set(x, y, z); m.rotation.y = rotY; scene.add(m);
}

building(84, 13, 9, 0, -66, 14, 4);
box(12, 6, 9.4, 0xf3e6c9, 0, 16, -66); box(12.8, .7, 10, 0x9a3412, 0, 19.35, -66);
const clockFace = new THREE.Mesh(new THREE.CircleGeometry(2.2, 32), new THREE.MeshBasicMaterial({ map: textTexture(['🕘'], 256, 256, '#ffffff', '#111', 200) }));
clockFace.position.set(0, 16, -61.25); scene.add(clockFace);
plate('에듀버스 학교', 0, 11.6, -61.45, 16);
box(8, 4, 1.2, 0x64748b, 0, 2, -61.2); // 현관
// 체육관 / 급식실
building(30, 10, 20, 70, -35, 6, 3, 0x1d4ed8, '#e2e8f0'); plate('🏀 체육관', 70, 8, -24.95, 10, '#1d4ed8');
building(26, 7, 16, -70, -35, 5, 2, 0x15803d); plate('🍚 급식실', -70, 5.6, -26.95, 9, '#15803d');
// 운동장
const field = new THREE.Mesh(new THREE.PlaneGeometry(76, 34), mat(0xc8a26b)); field.rotation.x = -Math.PI / 2; field.position.set(0, .04, 76); field.receiveShadow = true; scene.add(field);
const lineM = new THREE.MeshBasicMaterial({ color: 0xffffff });
const line = (w, d, x, z) => { const l = new THREE.Mesh(new THREE.PlaneGeometry(w, d), lineM); l.rotation.x = -Math.PI / 2; l.position.set(x, .06, z); scene.add(l); };
line(68, .25, 0, 61); line(68, .25, 0, 91); line(.25, 30, -34, 76); line(.25, 30, 34, 76); line(.25, 30, 0, 76);
const circ = new THREE.Mesh(new THREE.RingGeometry(4.8, 5.1, 40), lineM); circ.rotation.x = -Math.PI / 2; circ.position.set(0, .06, 76); scene.add(circ);
[-1, 1].forEach(s => { // 축구 골대
  const gx = s * 34;
  [-3, 3].forEach(dz => { cyl(.12, .12, 2.4, 0xffffff, gx, 1.2, 76 + dz, 8); colliders.push({ x: gx, z: 76 + dz, r: .3 }); });
  const bar = cyl(.12, .12, 6, 0xffffff, gx, 2.4, 76, 8); bar.rotation.x = Math.PI / 2;
  const net = new THREE.Mesh(new THREE.PlaneGeometry(6, 2.4), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: .35, side: THREE.DoubleSide })); net.position.set(gx + s * 1.2, 1.2, 76); net.rotation.y = Math.PI / 2; scene.add(net);
});
const ball = new THREE.Mesh(new THREE.SphereGeometry(.35, 16, 12), mat(0xffffff)); ball.position.set(3, .35, 74); ball.castShadow = true; scene.add(ball);
// 철봉 & 벤치
[-1, 0, 1].forEach(i => { const x = 46 + i * 2.2; cyl(.08, .08, 2.2, 0x94a3b8, x - 1, 1.1, 66, 6); cyl(.08, .08, 2.2, 0x94a3b8, x + 1, 1.1, 66, 6); const b = cyl(.05, .05, 2, 0xcbd5e1, x, 2.1, 66, 6); b.rotation.z = Math.PI / 2; });
[-20, -10, 10, 20].forEach(x => { box(4, .3, 1, 0x92400e, x, .6, 57.5); box(.3, .6, .8, 0x57534e, x - 1.6, .3, 57.5); box(.3, .6, .8, 0x57534e, x + 1.6, .3, 57.5); });
// 국기 게양대
cyl(.12, .15, 12, 0xe5e7eb, -30, 6, 56, 8); colliders.push({ x: -30, z: 56, r: .4 });
const flag = new THREE.Mesh(new THREE.PlaneGeometry(3, 2), new THREE.MeshBasicMaterial({ map: textTexture(['☯'], 300, 200, '#ffffff', '#1d4ed8', 150), side: THREE.DoubleSide })); flag.position.set(-28.4, 10.8, 56); scene.add(flag);
// 담장
[[0, -WORLD - 1, 2 * WORLD + 4, .5], [0, WORLD + 1, 2 * WORLD + 4, .5], [-WORLD - 1, 0, .5, 2 * WORLD + 4], [WORLD + 1, 0, .5, 2 * WORLD + 4]].forEach(([x, z, w, d]) => box(w, 2, d, 0x166534, x, 1, z));
// 나무 (담장 안쪽 둘레, 건물/운동장 피해서)
function tree(x, z) { cyl(.4, .5, 3, 0x8b5a2b, x, 1.5, z, 8); const top = new THREE.Mesh(new THREE.ConeGeometry(2.2, 5, 10), mat(0x2f7d32)); top.position.set(x, 5, z); top.castShadow = true; scene.add(top); colliders.push({ x, z, r: .6 }); }
for (let t = -84; t <= 84; t += 12) for (const [x, z] of [[t, -86], [t, 86], [-86, t], [86, t]]) {
  if (RECTS.some(r => x > r.x0 - 3 && x < r.x1 + 3 && z > r.z0 - 3 && z < r.z1 + 3)) continue;
  if (Math.abs(x) < 42 && z > 56) continue; // 운동장
  tree(x, z);
}
// 화단
[[-14, -57], [14, -57], [-14, 18], [14, 18]].forEach(([x, z]) => { box(6, .5, 2, 0x78350f, x, .25, z); for (let i = 0; i < 5; i++) { const f = new THREE.Mesh(new THREE.SphereGeometry(.3, 8, 6), mat(pick([0xf472b6, 0xfacc15, 0xf87171, 0xa78bfa]))); f.position.set(x - 2 + i, .75, z); scene.add(f); } });

// signs
function textTexture(lines, w = 1024, h = 512, bg = '#0f172a', fg = '#fff', size = 56) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h; const g = cv.getContext('2d');
  g.fillStyle = bg; g.fillRect(0, 0, w, h); g.fillStyle = fg; g.textAlign = 'center'; g.textBaseline = 'middle';
  lines.forEach((t, i) => { g.font = `${i === 0 ? 'bold ' : ''}${i === 0 ? size : size * .6}px Malgun Gothic, sans-serif`; g.fillText(t, w / 2, h / 2 + (i - (lines.length - 1) / 2) * size * 1.2); });
  const tx = new THREE.CanvasTexture(cv); tx.colorSpace = THREE.SRGBColorSpace; return tx;
}
function sign(text, x, z, rotY) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(6, 1.5), new THREE.MeshBasicMaterial({ map: textTexture([text], 1024, 256, '#1e293b', '#fff', 110), side: THREE.DoubleSide }));

}
sign('📚 강의실', 0, -24, 0); sign('🔭 과학관', 24, 0, -Math.PI / 2); sign('➗ 수학 퀴즈존', -24, 0, Math.PI / 2); sign('🏛 역사 전시관', 0, 24, Math.PI);

// ---------- Lecture hall ----------
const SLIDES = [
  ['오늘의 수업: 광합성', '식물은 어떻게 양분을 만들까?'],

const screen = new THREE.Mesh(new THREE.PlaneGeometry(14, 7), screenMat); screen.position.set(0, 4.5, -51.6); scene.add(screen);
const SEATS = [];
for (let r = 0; r < 3; r++) for (let c = 0; c < 4; c++) { const x = -6 + c * 4, z = -40 + r * 3.5; box(1.6, .5, 1.6, 0x60a5fa, x, .55, z); SEATS.push({ x, z: z + 1.2 }); }
let slideIdx = 0, slideT = 0;

// ---------- Science (solar system) ----------
const PLANETS = [
  ['수성', 0xb0a99f, .4, 3, '태양과 가장 가까운 행성. 1년이 88일!'],
  ['금성', 0xe9c46a, .6, 4.3, '가장 뜨거운 행성. 두꺼운 이산화탄소 대기.'],
  ['지구', 0x3b82f6, .65, 5.8, '액체 상태의 물과 생명이 있는 행성.'],

  ...MATH_SPOTS.map(([x, z]) => ({ x, z, label: 'E: 수학 퀴즈 풀기', act: () => mathQuiz() })),
  { x: 40, z: 6, label: 'E: 태양계 탐험', act: planetInfo },
  ...HIST_SPOTS.map(([x, z], i) => ({ x, z, label: `E: ${HISTORY[i][0]} 전시 보기`, act: () => histInfo(i) })),
  ...SEATS.map(s => ({ x: s.x, z: s.z, label: 'E: 자리에 앉아 수업 듣기', act: () => { sitAt(s); sys('수업에 참여했어요. (이동하면 일어나요)'); } })),
];
const pdisk = new THREE.Mesh(new THREE.RingGeometry(.9, 1.2, 24), new THREE.MeshBasicMaterial({ color: 0xfacc15, side: THREE.DoubleSide }));
pdisk.rotation.x = -Math.PI / 2; pdisk.position.set(40, .35, 6); scene.add(pdisk);

// ---------- Gather to lecture ----------
const MY_SEAT = 5;
function sitAt(s) { sitting = true; me.g.position.set(s.x, .5, s.z - 1.2); me.g.rotation.y = Math.PI; yaw = 0; markSeat(me, true); }

// ---------- Attendance ----------
const nowStr = () => new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
function markSeat(ent, seated) {
  if (!ent || ent.seated === seated || (isTeacher && ent === me)) return;
  ent.seated = seated;
  if (seated && !ent.attTime) { ent.attTime = nowStr(); sys(`📋 ${ANIMALS[ent.animal].emoji} ${ent.name} 출석! (${ent.attTime})`); }
  renderAttend();
}
function renderAttend() {
  if (!me) return;
  const all = isTeacher ? mates : [me, ...mates];
  $('attCount').textContent = `${all.filter(a => a.attTime).length}/${all.length}`;
  $('attTable').innerHTML = all.map(a => `<tr style="border-bottom:1px solid #1e293b"><td style="padding:3px 0">${ANIMALS[a.animal].emoji} ${a === me ? a.name + ' (나)' : a.name}</td>`
    + `<td style="text-align:right;color:${a.seated ? '#22c55e' : a.attTime ? '#facc15' : '#94a3b8'}">${a.seated ? '✅ 착석' : a.attTime ? '🚶 자리 비움' : '⬜ 미출석'}</td>`
    + `<td style="text-align:right;color:#94a3b8;font-size:11px;padding-left:6px">${a.attTime || ''}</td></tr>`).join('');
}
function showAttend(on) { $('attend').style.display = on ? 'block' : 'none'; renderAttend(); }
$('attBtn').onclick = () => { showAttend($('attend').style.display === 'none'); $('attBtn').blur(); };
function gatherToLecture() {
  if (!me) return;
  $('gather').blur();
  say(teacher, '여러분~ 수업 시작해요! 강의실로 모여주세요 📢', 6);
  sys(`👩‍🏫 ${teacher.name}: 수업 시작합니다! 모두 강의실로 모여주세요`);
  slideIdx = SLIDES.length - 1; slideT = -5; // 첫 슬라이드는 약 15초 뒤 시작
  screenMat.map.dispose(); screenMat.map = textTexture(['📢 곧 수업이 시작돼요', '자리에 앉아 주세요']); screenMat.needsUpdate = true;
  for (const a of [me, ...mates]) a.attTime = null; // 새 수업 출석부
  if (sitting) me.attTime = nowStr(); // 이미 앉아 있으면 바로 출석
  showAttend(true);
  const free = SEATS.filter((_, i) => isTeacher || i !== MY_SEAT).sort(() => Math.random() - .5);
  mates.forEach((m, i) => setTimeout(() => {
    m.g.position.y = 0; m.wait = 0; m.speed = 8; markSeat(m, false);
    m.target = { x: free[i].x, z: free[i].z - 1.2, sit: true, cls: true };
    if (i < 4) mateSay(m, pick(['네~ 가요!', '수업이다!', '달려가는 중 🏃', '기다려주세요 선생님!']));
  }, rnd(300, 2500)));
  if (isTeacher) {
    openModal(`<h3>📢 학생들을 강의실로 불렀어요</h3><p>학생 ${mates.length}명이 자리로 이동 중이에요. 출석부에서 착석 현황을 확인하세요.</p><div class="choices"><button class="btn primary" id="tp">✨ 교탁으로 이동</button><button class="btn" data-close>닫기</button></div>`);
    $('tp').onclick = () => { me.g.position.set(0, 0, -46); me.g.rotation.y = 0; yaw = 0; closeModal(); };
    return;
  }
  openModal(`<h3>📢 선생님이 강의실로 불렀어요</h3><p>친구들이 강의실로 이동하고 있어요. 어떻게 갈까요?</p><div class="choices"><button class="btn primary" id="tp">✨ 바로 자리로 이동</button><button class="btn" data-close>🚶 직접 걸어갈게요</button></div>`);
  $('tp').onclick = () => { sitAt(SEATS[MY_SEAT]); closeModal(); sys('자리에 앉았어요. (이동하면 일어나요)'); };
}
$('gather').onclick = gatherToLecture;

// ---------- Input ----------
const keys = {};
addEventListener('keydown', e => {
  if (!started) return;
  if (e.key === 'Enter') { $('msg').focus(); e.preventDefault(); return; }
  if (e.key === 'Escape') closeModal();
  keys[e.code] = true;
  if (e.code === 'KeyE' && !modalOpen && nearI) nearI.act();
  if (['Digit1', 'Digit2', 'Digit3', 'Digit4'].includes(e.code)) emote(['👋', '👏', '❓', '❤️'][+e.key - 1]);
});
addEventListener('keyup', e => keys[e.code] = false);
let yaw = 0, pitch = .45, dist = 11, drag = null;
$('c').addEventListener('pointerdown', e => drag = { x: e.clientX, y: e.clientY });
addEventListener('pointerup', () => drag = null);
addEventListener('pointermove', e => { if (!drag) return; yaw -= (e.clientX - drag.x) * .005; pitch = Math.min(1.3, Math.max(.1, pitch + (e.clientY - drag.y) * .004)); drag = { x: e.clientX, y: e.clientY }; });
addEventListener('wheel', e => dist = Math.min(25, Math.max(5, dist + e.deltaY * .01)));

// ---------- Start ----------
let role = 'student';
function setRole(r) {
  role = r; $('roleS').className = 'btn' + (r === 'student' ? ' primary' : ''); $('roleT').className = 'btn' + (r === 'teacher' ? ' primary' : '');
  $('nm').style.display = r === 'student' ? 'block' : 'none'; $('tForm').style.display = r === 'teacher' ? 'block' : 'none'; $('go').textContent = r === 'teacher' ? '로그인' : '입장하기';
}
$('roleS').onclick = () => setRole('student'); $('roleT').onclick = () => setRole('teacher');
$('tpw').addEventListener('keydown', e => { if (e.key === 'Enter') $('go').click(); });
function addGlasses(ent) {
  const gl = new THREE.Mesh(new THREE.TorusGeometry(.12, .025, 6, 16), new THREE.MeshBasicMaterial({ color: 0x111111 }));
  [-1, 1].forEach(s => { const c = gl.clone(); c.position.set(s * .19, 2.17, .55); ent.g.add(c); });
}
$('go').onclick = () => {
  if (started) return;
  let name;
  if (role === 'teacher') {
    if ($('tpw').value !== TEACHER_PASSWORD) { $('tErr').textContent = '비밀번호가 맞지 않아요.'; $('tpw').value = ''; return; }
    isTeacher = true; name = TEACHER_NAME; document.body.classList.add('teacher');
  } else name = $('nm').value.trim() || '학생';
  $('tpw').value = '';
  load(); me = makeAvatar(isTeacher ? 0x334155 : myColor, name + ' (나)', myAnimal); me.name = name; me.score = state.score;
  $('score').textContent = state.score; $('badges').textContent = [...state.badges].join(' ') || '-';
  $('start').style.display = 'none'; started = true;
  if (isTeacher) MATES.push(['은우', 0x10b981]); // 선생님 모드: 학생 10명
  spawnMates();
  if (isTeacher) {
    teacher = me; addGlasses(me); me.g.position.set(0, 0, -46);
    $('role').textContent = '👩‍🏫 선생님 모드';
    sys(`${name} 로그인. 학생 ${mates.length}명이 접속해 있어요`);
    setTimeout(() => mateSay(mates[1], `${name} 안녕하세요! 🙇`), 1500);
    setTimeout(() => mateSay(mates[0], '선생님 오늘 뭐 배워요?'), 3500);
  } else {
    me.g.position.set(0, 0, 8);
    teacher = makeAvatar(0x334155, 'AI 선생님', 'bear'); teacher.g.position.set(0, 0, -47.5); addGlasses(teacher);
    $('role').textContent = '🎒 학생';
    sys(`${name}님이 입장했어요. 현재 접속 10명`);
    setTimeout(() => mateSay(mates[1], `오 ${name} 왔다! 안녕~ 👋`), 1500);
    setTimeout(() => mateSay(mates[0], '같이 강의실 가자! 곧 수업 시작해'), 3500);
    autoGatherT = 60; // 학생 모드: AI 선생님이 주기적으로 소집
  }
};
let autoGatherT = Infinity;
$('nm').addEventListener('keydown', e => { if (e.key === 'Enter') $('go').click(); });

// ---------- Loop ----------
let nearI = null, chatT = 6, eventT = 15, lastZone = '';
const tmpV = new THREE.Vector3();
function collide(p) {
  for (const c of colliders) { const dx = p.x - c.x, dz = p.z - c.z, d = Math.hypot(dx, dz), r = c.r + .5; if (d < r && d > 0) { p.x = c.x + dx / d * r; p.z = c.z + dz / d * r; } }
  for (const r of RECTS) {
    const x0 = r.x0 - .5, x1 = r.x1 + .5, z0 = r.z0 - .5, z1 = r.z1 + .5;
    if (p.x > x0 && p.x < x1 && p.z > z0 && p.z < z1) {
      const dl = p.x - x0, dr = x1 - p.x, dt = p.z - z0, db = z1 - p.z, m = Math.min(dl, dr, dt, db);
      if (m === dl) p.x = x0; else if (m === dr) p.x = x1; else if (m === dt) p.z = z0; else p.z = z1;
    }
  }
  p.x = Math.max(-WORLD + 2, Math.min(WORLD - 2, p.x)); p.z = Math.max(-WORLD + 2, Math.min(WORLD - 2, p.z));
}
function animWalk(ent, moving, dt) {
  if (moving) { ent.walkT += dt * 10; ent.body.position.y = 1 + Math.abs(Math.sin(ent.walkT)) * .12; ent.g.rotation.z = Math.sin(ent.walkT) * .05; }
  else { ent.body.position.y += (1 - ent.body.position.y) * .2; ent.g.rotation.z = 0; }
}
function updateMates(dt) {
  for (const m of mates) {
    const p = m.g.position, t = m.target;
    if (m.wait > 0) { m.wait -= dt; animWalk(m, false, dt); if (m.wait <= 0) { m.target = randomTarget(m); p.y = 0; markSeat(m, false); } continue; }
    const dx = t.x - p.x, dz = t.z - p.z, d = Math.hypot(dx, dz);
    if (d < .4) {
      m.wait = t.cls ? 75 : t.sit ? rnd(15, 35) : rnd(3, 9);
      if (t.sit) { p.y = .5; m.g.rotation.y = Math.PI; m.speed = m.baseSpeed; markSeat(m, true); }
      if (t.greet && me && isTeacher) mateSay(m, pick(['선생님 안녕하세요!', '선생님 질문 있어요 ✋', '오늘 수업 재밌었어요!']));
      else if (t.greet && me) mateSay(m, pick([`${me.name} 뭐 해?`, `${me.name}! 같이 다니자`, '안녕 ㅎㅎ', `${me.name} 퀴즈 몇 점이야?`]));
      if (t.quiz && Math.random() < .6) setTimeout(() => { const g = pick([10, 20, 30]); m.score += g; say(m, `정답! +${g} ✨`, 3); }, 2000);
      animWalk(m, false, dt); continue;
    }
    const s = Math.min(d, m.speed * dt); p.x += dx / d * s; p.z += dz / d * s; collide(p);
    m.g.rotation.y = Math.atan2(dx, dz); animWalk(m, true, dt);
  }
}
const clock = new THREE.Clock();
const mini = $('mini').getContext('2d');
const MINI_EXTRA = [ // 지도에 표시할 건물 이름
  { name: '본관', x: 0, z: -66 }, { name: '체육관', x: 70, z: -35 }, { name: '급식실', x: -70, z: -35 },
];
function drawMini() {
  const S = 220, k = S / (2 * WORLD + 6), X = x => S / 2 + x * k, Z = z => S / 2 + z * k;
  const hex = c => '#' + c.toString(16).padStart(6, '0');
  mini.clearRect(0, 0, S, S);
  mini.fillStyle = '#3f7d3a'; mini.fillRect(X(-WORLD), Z(-WORLD), 2 * WORLD * k, 2 * WORLD * k);
  mini.fillStyle = '#c8a26b'; mini.fillRect(X(-38), Z(59), 76 * k, 34 * k); // 운동장
  for (const r of RECTS) { mini.fillStyle = '#e7dcc2'; mini.fillRect(X(r.x0), Z(r.z0), (r.x1 - r.x0) * k, (r.z1 - r.z0) * k); }
  for (const zn of ZONES) { if (zn.noPlat) continue; mini.fillStyle = hex(zn.color); mini.globalAlpha = .85; mini.beginPath(); mini.arc(X(zn.x), Z(zn.z), zn.r * k, 0, 7); mini.fill(); mini.globalAlpha = 1; }
  mini.textAlign = 'center'; mini.textBaseline = 'middle';
  const label = (t, x, y, size, color = '#fff') => { mini.font = `bold ${size}px Malgun Gothic, sans-serif`; mini.lineWidth = 3; mini.strokeStyle = 'rgba(0,0,0,.75)'; mini.strokeText(t, x, y); mini.fillStyle = color; mini.fillText(t, x, y); };
  // 장소 이름
  for (const zn of ZONES) label(zn.name, X(zn.x), Z(zn.z) + (zn.key === 'plaza' ? 0 : -zn.r * k + 6), 10, '#fde68a');
  for (const b of MINI_EXTRA) label(b.name, X(b.x), Z(b.z), 10, '#fde68a');
  // 사람 이름
  const people = [...mates, ...(teacher && teacher !== me ? [teacher] : [])];
  for (const m of people) { const px = X(m.g.position.x), pz = Z(m.g.position.z); mini.fillStyle = hex(m.color); mini.beginPath(); mini.arc(px, pz, 3, 0, 7); mini.fill(); label(m.name, px, pz - 7, 8); }
  if (me) { const px = X(me.g.position.x), pz = Z(me.g.position.z); mini.fillStyle = '#fff'; mini.strokeStyle = '#38bdf8'; mini.lineWidth = 2; mini.beginPath(); mini.arc(px, pz, 4.5, 0, 7); mini.fill(); mini.stroke(); label('나', px, pz - 9, 10, '#38bdf8'); }
}
let rankT = 0;
function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), .05), T = clock.elapsedTime;
  pl.forEach(p => { p.a += p.sp * dt; p.m.position.set(Math.cos(p.a) * p.d, 0, Math.sin(p.a) * p.d); });
  scene.traverse(o => { if (o.userData.spin) o.rotation.y += dt; });
  pdisk.material.opacity = .5 + Math.sin(T * 4) * .5;
  // lecture slides
  slideT += dt; if (slideT > 10) { slideT = 0; slideIdx = (slideIdx + 1) % SLIDES.length; screenMat.map.dispose(); screenMat.map = textTexture(SLIDES[slideIdx]); screenMat.needsUpdate = true; if (teacher) say(teacher, NARR[slideIdx], 8); if (me && lastZone === 'lecture') { sys(`👩‍🏫 ${teacher.name}: ${NARR[slideIdx]}`); if (sitting) addScore(2, '수업 참여'); } }

  if (started && me) {
    // player move
    let f = 0, r = 0;
    if (!modalOpen) { if (keys.KeyW || keys.ArrowUp) f++; if (keys.KeyS || keys.ArrowDown) f--; if (keys.KeyA || keys.ArrowLeft) r--; if (keys.KeyD || keys.ArrowRight) r++; }
    const moving = f || r;
    if (moving) {
      if (sitting) { sitting = false; me.g.position.y = 0; markSeat(me, false); }
      const fx = -Math.sin(yaw), fz = -Math.cos(yaw), len = Math.hypot(f, r), sp = (keys.ShiftLeft ? 10 : 6) * dt / len;
      const dx = (fx * f - fz * r) * sp, dz = (fz * f + fx * r) * sp;
      me.g.position.x += dx; me.g.position.z += dz; collide(me.g.position); me.g.rotation.y = Math.atan2(dx, dz);
    }
    animWalk(me, moving, dt);
    updateMates(dt);
    // camera
    const tp = me.g.position;
    camera.position.set(tp.x + Math.sin(yaw) * Math.cos(pitch) * dist, tp.y + Math.sin(pitch) * dist + 1.5, tp.z + Math.cos(yaw) * Math.cos(pitch) * dist);
    camera.lookAt(tp.x, tp.y + 1.6, tp.z);
    // zone
    const zn = zoneOf(tp.x, tp.z), zk = zn ? zn.key : 'plaza';
    if (zk !== lastZone) { lastZone = zk; $('zone').textContent = zn ? zn.name : '캠퍼스'; if (zn && zk !== 'plaza') { const cnt = mates.filter(m => zoneOf(m.g.position.x, m.g.position.z) === zn).length; sys(`${zn.name}에 도착! 친구 ${cnt}명이 함께 있어요`); } }
    // interact
    nearI = null; let best = 2.8;
    for (const it of INTERACTS) { const d = Math.hypot(it.x - tp.x, it.z - tp.z); if (d < best) { best = d; nearI = it; } }
    $('prompt').style.display = nearI && !modalOpen && !sitting ? 'block' : 'none'; if (nearI) $('prompt').textContent = nearI.label;
    // ambient chat
    chatT -= dt; if (chatT < 0) { chatT = rnd(5, 11); const m = pick(mates); const z = zoneOf(m.g.position.x, m.g.position.z); mateSay(m, pick(ZONE_LINES[z ? z.key : 'plaza'])); }
    eventT -= dt; if (eventT < 0) { eventT = rnd(20, 40); const m = pick(mates); const g = pick([10, 15, 20]); m.score += g; sys(pick([`${m.name}님이 수학 퀴즈 연속 정답! +${g}`, `${m.name}님이 🪐우주탐험가 배지를 향해 달리는 중! +${g}`, `${m.name}님이 역사 전시를 모두 관람했어요 +${g}`])); }
    rankT -= dt; if (rankT < 0) { rankT = 1; renderRank(); drawMini(); }
    // tags
    autoGatherT -= dt; if (autoGatherT < 0) { autoGatherT = 180; gatherToLecture(); }
    for (const ent of new Set([me, teacher, ...mates])) {
      tmpV.copy(ent.g.position); tmpV.y += 2.7; tmpV.project(camera);
      const vis = tmpV.z < 1 && ent.g.position.distanceTo(camera.position) < 45;
      ent.tag.style.display = vis ? 'block' : 'none';
      if (vis) { ent.tag.style.left = (tmpV.x * .5 + .5) * innerWidth + 'px'; ent.tag.style.top = (-tmpV.y * .5 + .5) * innerHeight + 'px'; }
      if (ent.bubbleT > 0) { ent.bubbleT -= dt; if (ent.bubbleT <= 0) ent.bb.style.display = 'none'; }
    }
  } else {
    camera.position.set(Math.sin(T * .1) * 50, 30, Math.cos(T * .1) * 50); camera.lookAt(0, 0, 0);
  }
  renderer.render(scene, camera);
}
tick();
</script>
</body>
</html>
